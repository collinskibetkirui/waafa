<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Waafi Loan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <header class="dashboard-header">
                <h1>🏦 Waafi Loan Agent</h1>
                <div class="user-info">
                    <span id="userName">Loading...</span>
                    <button id="logoutBtn" class="btn-secondary">Logout</button>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- User Profile Card -->
                <div class="card profile-card">
                    <h2>👤 Profile</h2>
                    <div class="profile-details">
                        <p><strong>Name:</strong> <span id="profileName">-</span></p>
                        <p><strong>Phone:</strong> <span id="profilePhone">-</span></p>
                        <p><strong>Email:</strong> <span id="profileEmail">-</span></p>
                    </div>
                </div>

                <!-- Loan Limit Card -->
                <div class="card limit-card">
                    <h2>💰 Loan Status</h2>
                    <div class="limit-details">
                        <div class="limit-item">
                            <span class="label">Total Limit</span>
                            <span class="value" id="totalLimit">-</span>
                        </div>
                        <div class="limit-item">
                            <span class="label">Borrowed</span>
                            <span class="value" id="totalBorrowed">-</span>
                        </div>
                        <div class="limit-item highlight">
                            <span class="label">Available</span>
                            <span class="value" id="availableLimit">-</span>
                        </div>
                        <div class="limit-bar">
                            <div class="limit-fill" id="limitFill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Apply for Loan -->
                <div class="card apply-card">
                    <h2>📋 Apply for Loan</h2>
                    <form id="loanForm">
                        <div class="form-group">
                            <label>Amount (SOS)</label>
                            <input 
                                type="number" 
                                id="loanAmount" 
                                placeholder="Enter amount" 
                                min="1000" 
                                step="1000"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label>Interest Rate (%)</label>
                            <input 
                                type="number" 
                                id="interestRate" 
                                value="5" 
                                step="0.5"
                                min="0"
                            />
                        </div>
                        <button type="submit" id="applyBtn" class="btn-primary">
                            💰 Apply & Disburse
                        </button>
                        <div id="loanMessage" class="loan-message"></div>
                    </form>
                </div>

                <!-- Loan History -->
                <div class="card history-card">
                    <h2>📊 Loan History</h2>
                    <div id="loanHistory">
                        <p>No loans yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let currentUser = null;

        // Check if user is logged in
        const userData = localStorage.getItem('waafi_user');
        if (!userData) {
            window.location.href = 'index.html';
        }

        currentUser = JSON.parse(userData);
        
        // Display user info
        document.getElementById('profileName').textContent = currentUser.fullName || 'N/A';
        document.getElementById('profilePhone').textContent = currentUser.phoneNumber || 'N/A';
        document.getElementById('profileEmail').textContent = currentUser.email || 'Not provided';
        document.getElementById('userName').textContent = `👋 ${currentUser.fullName || 'User'}`;

        // Load dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_BASE}/loan/user/${currentUser.id}`);
                const data = await response.json();
                
                if (data.success) {
                    // Update loan info
                    document.getElementById('totalLimit').textContent = 
                        parseFloat(data.user.loanLimit).toLocaleString();
                    document.getElementById('totalBorrowed').textContent = 
                        parseFloat(data.user.totalBorrowed).toLocaleString();
                    document.getElementById('availableLimit').textContent = 
                        parseFloat(data.user.availableLimit).toLocaleString();
                    
                    // Update limit bar
                    const total = parseFloat(data.user.loanLimit);
                    const borrowed = parseFloat(data.user.totalBorrowed);
                    const usedPercent = total > 0 ? (borrowed / total) * 100 : 0;
                    document.getElementById('limitFill').style.width = `${Math.min(usedPercent, 100)}%`;
                    
                    // Update loan history
                    const historyDiv = document.getElementById('loanHistory');
                    if (data.activeLoans && data.activeLoans.length > 0) {
                        let html = '<div class="loan-list">';
                        data.activeLoans.forEach(loan => {
                            const statusClass = loan.status === 'disbursed' ? 'status-disbursed' : 
                                               loan.status === 'repaid' ? 'status-repaid' : 'status-pending';
                            html += `
                                <div class="loan-item">
                                    <span class="loan-ref">${loan.loan_reference}</span>
                                    <span class="loan-amount">${parseFloat(loan.amount).toLocaleString()} SOS</span>
                                    <span class="loan-status ${statusClass}">${loan.status}</span>
                                </div>
                            `;
                        });
                        html += '</div>';
                        historyDiv.innerHTML = html;
                    } else {
                        historyDiv.innerHTML = '<p style="color: #888;">No active loans</p>';
                    }
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Apply for loan
        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = document.getElementById('loanAmount').value;
            const rate = document.getElementById('interestRate').value;
            const messageDiv = document.getElementById('loanMessage');
            const applyBtn = document.getElementById('applyBtn');
            
            if (!amount || parseFloat(amount) <= 0) {
                messageDiv.textContent = '❌ Please enter a valid amount';
                messageDiv.className = 'loan-message error';
                return;
            }
            
            applyBtn.disabled = true;
            applyBtn.textContent = '⏳ Processing...';
            messageDiv.textContent = '';
            messageDiv.className = 'loan-message';
            
            try {
                const response = await fetch(`${API_BASE}/loan/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        amount: parseFloat(amount),
                        interestRate: parseFloat(rate) || 5
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.textContent = `✅ ${data.message}`;
                    messageDiv.className = 'loan-message success';
                    setTimeout(loadDashboard, 1000);
                    document.getElementById('loanAmount').value = '';
                } else {
                    messageDiv.textContent = `❌ ${data.message}`;
                    messageDiv.className = 'loan-message error';
                }
            } catch (error) {
                messageDiv.textContent = '❌ Network error: ' + error.message;
                messageDiv.className = 'loan-message error';
            } finally {
                applyBtn.disabled = false;
                applyBtn.textContent = '💰 Apply & Disburse';
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('waafi_user');
            window.location.href = 'index.html';
        });

        // Load initial data
        loadDashboard();
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
